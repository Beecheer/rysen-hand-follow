[project]
name = "rysen-hand-preview"
version = "0.1.0"
description = "Windows webcam hand tracking, calibration, URDF preview and Rysen SDK follow"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "mediapipe>=0.10.21,<0.11",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<5",
    "pyrealsense2>=2.56.5,<2.57",
    "scipy>=1.14,<2",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
]

[tool.uv]
package = false
